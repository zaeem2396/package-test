version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: always
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      # Datadog APM (traces to agent)
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
      DD_TRACE_AGENT_URL: http://datadog-agent:8126
      DD_SERVICE: package-test
      DD_ENV: ${APP_ENV:-local}
      DD_VERSION: "1.0"
      DD_TRACE_AUTO_FLUSH_ENABLED: "1"
      DD_TRACE_SAMPLE_RATE: "1"
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      datadog-agent:
        condition: service_started

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_queue
    restart: always
    volumes:
      - .:/var/www/html
    command: php artisan queue:work database --sleep=3 --tries=3
    environment:
      DB_HOST: mysql
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: always
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - mysql
    networks:
      - app-network

  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    container_name: laravel_datadog_agent
    restart: always
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-us5.datadoghq.com}
      DD_HOSTNAME: package-test-agent
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_APM_MAX_TPS: "100"
      DD_APM_ENABLE_RARE_SAMPLER: "true"
      DD_APM_ERROR_TPS: "50"
    ports:
      - "8126:8126"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
